<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>ポートフォリオへの招待</title>
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <nav aria-label="Language">
      <button type="button" data-lang="ja" lang="ja" aria-pressed="true">日本語</button>
      <button type="button" data-lang="zh" lang="zh" aria-pressed="false">中文</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    </nav>
    <h1 id="title"></h1>
    <p id="message" role="status" aria-live="polite"></p>
    <noscript><p lang="ja">この招待リンクを開くには JavaScript を有効にしてください。</p><p lang="zh">请启用 JavaScript 后打开此邀请链接。</p><p lang="en">Please enable JavaScript to open this invitation.</p></noscript>
  </main>
</body>
</html>
