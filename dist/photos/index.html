<!doctype html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>写真 | Cloud & Nature</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">

<body>
  <a class="skip" href="#main" data-i18n="skip">本文へ移動</a>
  <header class="header">
    <a class="brand" href="../index.html">CLOUD <span>&</span> NATURE</a>
    <nav class="languages" aria-label="Language / 言語 / 语言">
      <button type="button" data-lang="ja" aria-label="日本語" aria-pressed="true">JP</button>
      <button type="button" data-lang="zh" aria-label="中文" aria-pressed="false">中</button>
      <button type="button" data-lang="en" aria-label="English" aria-pressed="false">EN</button>
    </nav>
  </header>
  <main id="main">
    <section class="intro">
      <p class="eyebrow">PHOTOGRAPHY / ORIGINAL JPG</p>
      <h1 data-i18n="title">写真を見て、原寸でダウンロード。</h1>
      <p class="lead" data-i18n="intro">自分で撮影し、仕上げた写真です。プレビューで選んで、元のサイズの JPG を保存できます。</p>
      <p class="local-notice" id="local-notice" data-i18n="localNotice" hidden>ローカル動作確認用です。AWS のデータベース・招待認証には接続していません。</p>
    </section>
    <section class="album" aria-labelledby="album-title">
      <div class="album-heading"><h2 id="album-title" data-i18n="albumTitle">写真コレクション</h2><p id="page-summary"></p></div>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="retry" class="secondary" type="button" data-i18n="retry" hidden>もう一度読み込む</button>
      <div id="gallery" class="gallery" aria-busy="true"></div>
      <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
        <button id="previous" type="button" data-i18n="previous">前のページ</button>
        <span id="page-number"></span>
        <button id="next" type="button" data-i18n="next">次のページ</button>
      </nav>
      <p class="download-note" data-i18n="downloadNote">ダウンロードは元サイズの JPG です。保存先や完了状況はブラウザーで確認してください。</p>
    </section>
  </main>
  <footer><a href="../index.html#sapporo" data-i18n="back">ポートフォリオへ戻る</a><span>CLOUD & NATURE</span></footer>

    <div class="dialog-heading"><h2 id="preview-title"></h2><button id="close-preview" type="button" data-i18n="close">閉じる</button></div>
    <img id="preview-image" alt="">
    <a id="preview-download" class="download" data-i18n="download">JPG をダウンロード</a>
  </dialog>
